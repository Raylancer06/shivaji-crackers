<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
      <stop offset="0%" stop-color="#7B141C" />
      <stop offset="70%" stop-color="#550C12" />
      <stop offset="100%" stop-color="#2D0509" />
    </radialGradient>

    <!-- Royal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E09A" />
      <stop offset="25%" stop-color="#D4972B" />
      <stop offset="50%" stop-color="#FDF1BA" />
      <stop offset="75%" stop-color="#C98E2A" />
      <stop offset="100%" stop-color="#8E5D11" />
    </linearGradient>

    <!-- Spark Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D92D20" />
      <stop offset="40%" stop-color="#F04438" />
      <stop offset="80%" stop-color="#F79009" />
      <stop offset="100%" stop-color="#FEDF89" />
    </linearGradient>
  </defs>

  <!-- Outer Circular Gold Ring -->
  <circle cx="250" cy="250" r="236" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="9" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Radiating Sparkle Rays -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85">
    <line x1="250" y1="95" x2="250" y2="70" stroke-linecap="round" />
    <line x1="250" y1="265" x2="250" y2="290" stroke-linecap="round" />
    <line x1="160" y1="180" x2="140" y2="180" stroke-linecap="round" />
    <line x1="340" y1="180" x2="360" y2="180" stroke-linecap="round" />
    <line x1="186" y1="116" x2="168" y2="98" stroke-linecap="round" />
    <line x1="314" y1="116" x2="332" y2="98" stroke-linecap="round" />
    <line x1="186" y1="244" x2="168" y2="262" stroke-linecap="round" />
    <line x1="314" y1="244" x2="332" y2="262" stroke-linecap="round" />
  </g>

  <!-- Central Festive Firework / Diya Icon -->
  <g transform="translate(250, 180)">
    <!-- Base Diya bowl in Gold -->
    <path d="M -50 15 C -45 42 45 42 50 15 C 30 18 -30 18 -50 15 Z" fill="url(#goldGrad)" />
    <!-- Diya pedestal -->
    <path d="M -22 36 C -12 44 12 44 22 36 L 28 44 C 14 49 -14 49 -28 44 Z" fill="url(#goldGrad)" />
    
    <!-- Central Rising Flame -->
    <path d="M 0 -45 C 18 -18 24 0 0 16 C -24 0 -18 -18 0 -45 Z" fill="url(#flameGrad)" />
    <!-- Inner Golden Glow -->
    <path d="M 0 -30 C 9 -12 12 0 0 10 C -12 0 -9 -12 0 -30 Z" fill="#FFF4D3" />

    <!-- Left & Right Sparks -->
    <path d="M -28 -15 C -20 -8 -15 -2 -22 8 C -32 2 -30 -8 -28 -15 Z" fill="url(#goldGrad)" />
    <path d="M 28 -15 C 20 -8 15 -2 22 8 C 32 2 30 -8 28 -15 Z" fill="url(#goldGrad)" />
    
    <!-- Star Glints -->
    <polygon points="0,-60 3,-52 11,-52 5,-47 7,-39 0,-44 -7,-39 -5,-47 -11,-52 -3,-52" fill="#FDF1BA" />
  </g>

  <!-- Brand Typography: SIVAJI -->
  <text x="250" y="325"
        font-family="'Mona Sans', 'Cinzel', 'Playfair Display', Georgia, serif"
        font-size="44"
        font-weight="900"
        letter-spacing="5"
        fill="url(#goldGrad)"
        text-anchor="middle">
    SIVAJI
  </text>

  <!-- Brand Typography: FIRECRACKER -->
  <text x="250" y="365"
        font-family="'Mona Sans', 'Cinzel', 'Playfair Display', Georgia, serif"
        font-size="28"
        font-weight="800"
        letter-spacing="7"
        fill="#FAF8F5"
        text-anchor="middle">
    FIRECRACKER
  </text>

  <!-- Subtitle Ribbon / Location -->
  <g transform="translate(250, 400)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#3D060B" stroke="url(#goldGrad)" stroke-width="1.5" />
    <text x="0" y="5"
          font-family="'Mona Sans', system-ui, sans-serif"
          font-size="11"
          font-weight="800"
          letter-spacing="2.5"
          fill="#F0B543"
          text-anchor="middle">
      HYDERABAD • PREMIUM SIVAKASI
    </text>
  </g>

  <!-- Small Bottom Stars -->
  <g fill="url(#goldGrad)">
    <polygon points="250,428 252,433 257,433 253,436 254,441 250,438 246,441 247,436 243,433 248,433" />
    <polygon points="230,429 231,433 235,433 232,435 233,439 230,437 227,439 228,435 225,433 229,433" transform="scale(0.85) translate(40, 80)" />
    <polygon points="270,429 271,433 275,433 272,435 273,439 270,437 267,439 268,435 265,433 269,433" transform="scale(0.85) translate(48, 80)" />
  </g>
</svg>
