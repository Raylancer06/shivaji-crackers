<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#200306" />
      <stop offset="50%" stop-color="#4A0A10" />
      <stop offset="100%" stop-color="#1A0204" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5B5" />
      <stop offset="30%" stop-color="#F0B543" />
      <stop offset="70%" stop-color="#C98E2A" />
      <stop offset="100%" stop-color="#8C5C12" />
    </linearGradient>

    <!-- Radial Burst Glow -->
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#F0B543" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#C98E2A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#200306" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for soft drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Radial Glow Behind Logo -->
  <circle cx="400" cy="260" r="280" fill="url(#glow)" />

  <!-- Subtle Decorative Border -->
  <rect x="24" y="24" width="752" height="552" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" />
  <rect x="32" y="32" width="736" height="536" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6,6" stroke-opacity="0.25" />

  <!-- Corner Festive Ornaments -->
  <!-- Top Left -->
  <g transform="translate(44, 44)" fill="url(#goldGrad)" opacity="0.6">
    <circle cx="0" cy="0" r="3" />
    <circle cx="12" cy="0" r="2" />
    <circle cx="0" cy="12" r="2" />
  </g>
  <!-- Top Right -->
  <g transform="translate(756, 44)" fill="url(#goldGrad)" opacity="0.6">
    <circle cx="0" cy="0" r="3" />
    <circle cx="-12" cy="0" r="2" />
    <circle cx="0" cy="12" r="2" />
  </g>
  <!-- Bottom Left -->
  <g transform="translate(44, 556)" fill="url(#goldGrad)" opacity="0.6">
    <circle cx="0" cy="0" r="3" />
    <circle cx="12" cy="0" r="2" />
    <circle cx="0" cy="-12" r="2" />
  </g>
  <!-- Bottom Right -->
  <g transform="translate(756, 556)" fill="url(#goldGrad)" opacity="0.6">
    <circle cx="0" cy="0" r="3" />
    <circle cx="-12" cy="0" r="2" />
    <circle cx="0" cy="-12" r="2" />
  </g>

  <!-- Central Firework Sparkle Elements -->
  <!-- Sparks -->
  <g opacity="0.5">
    <circle cx="280" cy="160" r="2" fill="#F0B543" />
    <circle cx="520" cy="160" r="2" fill="#F0B543" />
    <circle cx="220" cy="240" r="3" fill="#F0B543" />
    <circle cx="580" cy="240" r="3" fill="#F0B543" />
    <circle cx="250" cy="340" r="2.5" fill="#F0B543" />
    <circle cx="550" cy="340" r="2.5" fill="#F0B543" />
  </g>

  <!-- Central Brand Shield / Emblem -->
  <g filter="url(#shadow)">
    <!-- Outer Crest Circle -->
    <circle cx="400" cy="220" r="76" fill="#200306" stroke="url(#goldGrad)" stroke-width="4" />
    <circle cx="400" cy="220" r="68" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7" />

    <!-- Crackers / Fireworks Icon inside Crest -->
    <!-- Stylized Burst / Star -->
    <path d="M400 172 L407 198 L433 194 L415 212 L430 234 L404 228 L396 254 L390 228 L364 234 L379 212 L361 194 L387 198 Z" fill="url(#goldGrad)" />
    <!-- Sparkler center -->
    <circle cx="400" cy="220" r="8" fill="#FFF" />
    <circle cx="400" cy="220" r="4" fill="#550C12" />
  </g>

  <!-- Brand Typography -->
  <text x="400" y="342" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
    SIVAJI FIRECRACKER
  </text>

  <text x="400" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#EAD5B0" text-anchor="middle" letter-spacing="3">
    AUTHENTIC FACTORY GREEN FIREWORKS
  </text>

  <!-- Decorative Separator Line -->
  <path d="M260 400 L370 400 M430 400 L540 400" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />
  <polygon points="400,396 405,400 400,404 395,400" fill="url(#goldGrad)" />

  <!-- Badge Capsule -->
  <g transform="translate(250, 424)">
    <rect width="300" height="38" rx="19" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5" />
    <circle cx="28" cy="19" r="7" fill="#10B981" />
    <path d="M25 19 L27.5 21.5 L31.5 16.5" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="160" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#6EE7B7" text-anchor="middle" letter-spacing="1">
      100% CSIR-NEERI GREEN CERTIFIED
    </text>
  </g>

  <!-- Subtitle Note -->
  <text x="400" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#C9B7A5" text-anchor="middle">
    Official Sivaji Firecracker Box • Direct Hyderabad Wholesale
  </text>
  <text x="400" y="524" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#8C7A70" text-anchor="middle">
    Genuine Festive Batch • High Quality Sound &amp; Visual Display
  </text>
</svg>